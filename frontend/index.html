<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Platform 2026 | Dark Glass</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="auth-modal" class="glass-modal active">
        <div class="modal-content">
            <div class="logo-area">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h2 id="auth-title">تسجيل الدخول</h2>
            <p id="auth-subtitle">أدخل رقم هاتفك للمتابعة</p>
            
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="phoneInput" placeholder="2010XXXXXXXX" autocomplete="off">
            </div>

            <div class="input-group hidden" id="otp-group">
                <i class="fa-solid fa-lock"></i>
                <input type="text" id="otpInput" placeholder="أدخل الرمز (6 أرقام)" maxlength="6" autocomplete="off">
            </div>

            <button id="btn-auth" class="ios-btn primary" onclick="handleAuth()">طلب الرمز</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <div id="app-container" class="glass-container hidden">
        
        <div class="video-section">
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay muted playsinline></video>
                
                <div class="call-controls glass-panel">
                    <button id="btn-mic" class="control-btn active" onclick="toggleMic()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button id="btn-cam" class="control-btn active" onclick="toggleCam()">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <button id="btn-flip" class="control-btn" onclick="flipCamera()">
                        <i class="fa-solid fa-camera-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-section glass-panel">
            <div class="chat-header">
                <h3><i class="fa-solid fa-messages"></i> غرفة المحادثة</h3>
                <span id="currentUserDisplay" class="user-badge"></span>
            </div>
            
            <div id="messages-container" class="messages-area">
                </div>
            
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
                <button id="btn-send" class="ios-btn send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
