<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- دعم الشاشات الكاملة (Notch) في الموبايل وجعله يتصرف كتطبيق Native -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Platform 2026 | Dark Glass Engine</title>

    <!-- FontAwesome للأيقونات (الإصدار الأحدث) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- ملف التنسيقات الرئيسي -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-dark">

    <!-- ========================================== -->
    <!-- 1. خلفية زجاجية متحركة (Blobs)             -->
    <!-- ========================================== -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- ========================================== -->
    <!-- 2. شاشة تسجيل الدخول (Auth Overlay)        -->
    <!-- ========================================== -->
    <div id="auth-modal" class="auth-overlay active glass-panel">
        <div class="glass-modal">
            <div class="logo-area">
                <i class="fa-brands fa-telegram"></i>
            </div>
            <h2 id="auth-title">تسجيل الدخول</h2>
            <p id="auth-subtitle">أدخل رقم هاتفك للمتابعة</p>
            
            <!-- حقل رقم الهاتف -->
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="phoneInput" placeholder="رقم الهاتف (مثال: 2010...)" autocomplete="off">
            </div>

            <!-- حقل رمز التحقق (OTP) - مخفي افتراضياً -->
            <div class="input-group hidden" id="otp-group">
                <i class="fa-solid fa-lock"></i>
                <input type="text" id="otpInput" placeholder="الرمز (6 أرقام)" maxlength="6" autocomplete="off">
            </div>

            <button id="btn-auth" class="ios-btn primary" onclick="handleAuth()">التالي</button>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. الهيكل الرئيسي للتطبيق (App Layout)     -->
    <!-- مخفي حتى يتم تسجيل الدخول بنجاح            -->
    <!-- ========================================== -->
    <div id="app-container" class="telegram-app-layout hidden">
        
        <!-- أداة مكالمات الفيديو (Picture-in-Picture) عائمة فوق الشات -->
        <div id="video-overlay" class="video-pip video-section hidden glass-panel">
            <div class="video-wrapper">
                <!-- الفيديوهات -->
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay muted playsinline></video>
                
                <!-- أزرار التحكم في المكالمة -->
                <div class="call-controls">
                    <button id="btn-mic" class="control-btn active" onclick="toggleMic()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button id="btn-cam" class="control-btn active" onclick="toggleCam()">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <button id="btn-flip" class="control-btn" onclick="flipCamera()">
                        <i class="fa-solid fa-camera-rotate"></i>
                    </button>
                    <button id="btn-end" class="control-btn danger" onclick="RTCEngine.endCall()">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- الحاوية الأساسية للشات -->
        <!-- ملف chat.js (ChatUI.buildLayout) سيقوم بحقن القائمة الجانبية والشات هنا -->
        <div class="chat-section w-100 h-100">
            <!-- جافاسكريبت سيبني الواجهة هنا -->
        </div>

        <!-- القائمة الجانبية اليمنى (معلومات الحساب والميديا) مخفية افتراضياً -->
        <!-- يتم فتحها عند الضغط على اسم المستخدم في أعلى الشات -->
        <div class="right-sidebar hidden glass-panel" id="right-sidebar">
            <div class="profile-header">
                <button class="close-sidebar-btn" onclick="toggleRightSidebar()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h3>معلومات الحساب</h3>
            </div>
            <div class="profile-content" id="profile-content-area">
                <!-- محتوى البروفايل (صور، ملفات، روابط) سيتم حقنه هنا -->
            </div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- 4. قائمة الرسائل الزجاجية (Context Menu)   -->
    <!-- ========================================== -->
    <div id="message-context-menu" class="glass-context-menu hidden">
        <div class="context-menu-item" id="menu-reply">
            <i class="fa-solid fa-reply"></i> رد
        </div>
        <div class="context-menu-item" id="menu-copy">
            <i class="fa-solid fa-copy"></i> نسخ
        </div>
        <div class="context-menu-item" id="menu-edit">
            <i class="fa-solid fa-pen"></i> تعديل
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item danger" id="menu-delete">
            <i class="fa-solid fa-trash"></i> مسح
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. ربط ملفات الجافاسكريبت                 -->
    <!-- ========================================== -->
    <script src="js/auth.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/ui_core.js"></script>
    <script src="js/ui_integration.js"></script>
    <script src="js/chat.js"></script>

</body>
</html>
